apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: airflow-helm-repo1
  namespace: ns-cs9-test
spec:
  interval: 1m
  url: https://airflow.apache.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: ns-cs9-test
  annotations:
    force-redeploy: "X"  # or any unique value (e.g. timestamp)
spec:
  releaseName: airflow
  interval: 5m
  timeout: 5m  
  chart:
    spec:
      chart: airflow
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: airflow-helm-repo1
        namespace: ns-cs9-test
  values:
    images:
      airflow:
        repository: ghcr.io/fhidev/fhi.fida.cs/skybert-airflow
        tag: latest
        pullPolicy: Always
#    airflow:
#      extraInitContainers:
#        - name: check-dag-dir
#          image: ghcr.io/fhidev/fhi.fida.cs/skybert-airflow
#          command: ["sh", "-c", "echo 'Contents of /opt/airflow/dags:' && ls -la /opt/airflow/dags"]
        
#    data:
#      metadataConnection:
#        user: altformyerettigheter
#        pass: portalazurecomcreateMicrosoftPostgreSQLServer
#        protocol: postgresql
#        host: airflow-cs9-test.postgres.database.azure.com
#        port: 5432
#        db: postgres
#        sslmode: require
    postgresql:
      enabled: true
    redis:
      enabled: true
    dags:
      persistence:
        enabled: false
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
    migrateDatabaseJob:
      useHelmHooks: false
      applyCustomEnv: false
    startupProbe:
      httpGet:
        path: /health
        port: 8080
        scheme: HTTP
      timeoutSeconds: 60
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 20
