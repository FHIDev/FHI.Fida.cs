apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: airflow-helm-repo1
  namespace: ns-cs9-test
spec:
  interval: 1m
  url: https://airflow.apache.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: ns-cs9-test
spec:
  releaseName: airflow
  interval: 6m
  timeout: 5m  
  chart:
    spec:
      chart: airflow
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: airflow-helm-repo1
        namespace: ns-cs9-test
  values:
    data:
      metadataConnection:
        user: altformyerettigheter
        pass: portal.azure.comcreateMicrosoft.PostgreSQLServer
        protocol: postgresql
        host: airflow-cs9-test.postgres.database.azure.com
        port: 5432
        db: postgres
        sslmode: disable
  
    defaultUser:
      enabled: true
      role: Admin
      username: admin3
      email: admin@example2.com
      firstName: admin2
      lastName: user2
      password: admin2
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
    migrateDatabaseJob:
      useHelmHooks: false
      applyCustomEnv: false
    postgresql:
      enabled: false
