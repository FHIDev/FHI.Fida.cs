apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: airflow-helm-repo1
  namespace: ns-cs9-test
spec:
  interval: 1m
  url: https://airflow.apache.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: ns-cs9-test
spec:
  releaseName: airflow
  interval: 5m
  timeout: 5m  
  chart:
    spec:
      chart: airflow
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: airflow-helm-repo1
        namespace: ns-cs9-test
  values:
    dags:
      persistence:
        enabled: false  # Disable DAG volume mount that would override gitSync
      gitSync:
        enabled: true
        repo: https://github.com/FHIDev/FHI.Fida.cs.git
        branch: skybert-airflow-dags
        subPath: ""  # if your DAG files are inside a 'dags/' folder in the repo root
        depth: 1

    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
    migrateDatabaseJob:
      useHelmHooks: false
      applyCustomEnv: false
    postgresql:
      enabled: true
    redis:
      enabled: true
