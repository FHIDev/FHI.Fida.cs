apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app-cs9-test
#    fluentbit.fluent.io/enabled: "true"
  name: deployment-cs9-test
  namespace: ns-cs9-test
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: app-cs9-test
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: app-cs9-test
#        fluentbit.fluent.io/enabled: "true"
    spec:
      containers:
#      - image: tutum/hello-world
      - image: ghcr.io/fhidev/fhi.fida.cs/skybert-workbench:latest
        imagePullPolicy: Always
        name: ct-cs9
        ports:
        - containerPort: 8787
          name: cs9-port
        env:
        - name: RSP_TESTUSER_UID
          value: "1001"
        - name: RSP_TESTUSER
          value: rstudio
        - name: RSP_TESTUSER_PASSWD
          value: helloworld
        - name: dddddddd
          value: helloworld
        - name: CS9_DBCONFIG_USER
          value: yourusername
        - name: CS9_DBCONFIG_PASSWORD
          value: yourStrongPassword100
        - name: CS9_AUTO
          value: "0"
        - name: CS9_PATH
          value: /cs9path
        - name: CS9_DBCONFIG_ACCESS
          value: config/anon
        - name: CS9_DBCONFIG_DRIVER
          value: PostgreSQL Unicode
        - name: CS9_DBCONFIG_PORT
          value: "5432"
        - name: CS9_DBCONFIG_SSLMODE
          value: "no"
        - name: CS9_DBCONFIG_ROLE_CREATE_TABLE
          value: yourusername
        - name: CS9_DBCONFIG_SERVER
          value: postgres-service
        - name: CS9_DBCONFIG_SCHEMA_CONFIG
          value: public
        - name: CS9_DBCONFIG_DB_CONFIG
          value: postgres
        - name: CS9_DBCONFIG_SCHEMA_ANON
          value: public
        - name: CS9_DBCONFIG_DB_ANON
          value: postgres
        resources:
#          limits:
#            cpu: 4000m
#            memory: 8192Mi
          requests:
            cpu: 2000m
            memory: 4096Mi
        volumeMounts:
        - mountPath: /secrets/
          name: volume-akv-secret-1
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          nodePublishSecretRef:
            name: secret-akv-sp           # Service principal secret
          readOnly: true
          volumeAttributes:
            secretProviderClass: akv-cs9-test
        name: volume-akv-secret-1
