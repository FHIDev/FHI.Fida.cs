apiVersion: source.toolkit.fluxcd.io/v1
# view config doc here: https://github.com/apache/airflow/blob/main/chart/values.yaml
kind: HelmRepository
metadata:
  name: airflow-helm-repo2
  namespace: ns-cs9-test
spec:
  interval: 1m
  url: https://airflow.apache.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: ns-cs9-test
spec:
  releaseName: airflow
  interval: 5m
  timeout: 5m  
  chart:
    spec:
      chart: airflow
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: airflow-helm-repo2
        namespace: ns-cs9-test
  values:
    dags:
      persistence:
        enabled: false  # Disable DAG volume mount that would override gitSync
      gitSync:
        enabled: true
        repo: https://github.com/FHIDev/FHI.Fida.cs.git
        branch: skybert-airflow-dags
        subPath: ""  # if your DAG files are inside a 'dags/' folder in the repo root
        depth: 1

    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
    migrateDatabaseJob:
      useHelmHooks: false
      applyCustomEnv: false
    postgresql:
      enabled: false
    redis:
      enabled: false  # Disabled - not needed for KubernetesExecutor
    webserver:
      extraVolumes:
        - name: webserver-config
          configMap:
            name: airflow-webserver-config
        - name: azure-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: akv-cs9-test
        - name: pod-template
          configMap:
            name: airflow-pod-template
      extraVolumeMounts:
        - name: webserver-config
          mountPath: /opt/airflow/webserver_config.py
          subPath: webserver_config.py
          readOnly: true
        - name: azure-secrets
          mountPath: /opt/airflow/secrets/
          readOnly: true
        - name: pod-template
          mountPath: /opt/airflow/pod_template.yaml
          subPath: pod_template.yaml
          readOnly: true

    # KubernetesExecutor Configuration
    config:
      core:
        executor: KubernetesExecutor
      kubernetes:
        namespace: ns-cs9-test
        pod_template_file: /opt/airflow/pod_template.yaml
        worker_container_repository: apache/airflow
        worker_container_tag: "3.0.5"
        delete_worker_pods: true
        delete_worker_pods_on_success: true
        delete_worker_pods_on_failure: false

    data:
      metadataConnection:
         user: altformyerettigheter
         pass: portalazurecomcreateMicrosoftPostgreSQLServer
         protocol: postgresql
         host: airflow-cs9-test.postgres.database.azure.com
         port: 5432
         db: postgres
         sslmode: prefer
