# Simple dependency management for platform scripts
[project]
name = "fhi-fida-cs-platform"
version = "0.1.0"
description = "Platform operators and validation for FHI Airflow multi-team infrastructure"
readme = "DEVELOPMENT.md"
requires-python = ">=3.10"

# Core runtime dependencies
dependencies = [
    "apache-airflow>=3.0.6",
    "apache-airflow-providers-cncf-kubernetes>=10.8.0",
    "pyyaml>=6.0.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
strict = true
